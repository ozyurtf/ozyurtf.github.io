<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
    <title>Publications</title>
    <style>
        body {
            font-family: Avenir, 'Avenir Next', 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.5;
            max-width: 650px;
            margin: 0;
            padding: 2rem;
            color: #1a1a1a;
            font-size: 0.85rem;
        }

        .nav {
            margin-bottom: 2rem;
            /* Offset the tab padding/border so the first tab's text
               still aligns with the page content on the left */
            margin-left: -10px;
        }

        .nav a {
            color: #1a1a1a;
            text-decoration: none;
            margin-right: 1.5rem;
            font-size: 0.85rem;
            padding: 4px 9px;
            border: 1px solid transparent;
            border-radius: 2px;
        }

        .nav a:hover {
            text-decoration: none;
            border-color: #555;
        }

        .nav a.nav-home:hover {
            background-color: #ffd84d;
        }

        .nav a.nav-neuroscience:hover {
            background-color: #ffd84d;
        }

        .nav a.nav-projects:hover {
            background-color: #ffd84d;
        }

        .nav a.nav-publications:hover {
            background-color: #ffd84d;
        }

        .nav a.nav-drawings:hover {
            background-color: #ffd84d;
        }

        .nav a.active {
            text-decoration: underline;
        }

        .nav a.active:hover {
            text-decoration: none;
        }

        a {
            color: #1a1a1a;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 2px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0 0 2rem;
        }

        li {
            margin-bottom: 0.8rem;
        }

        /* Each publication gets the site's hover rectangle, matching every
           other page. */
        .topics a {
            display: inline-block;
            padding: 4px 9px;
            /* Offset the padding/border so the text still aligns with the
               page content on the left (matches the nav tab offset) */
            margin-left: -10px;
            border: 1px solid transparent;
            border-radius: 2px;
            transition: border-color .18s ease, background-color .18s ease;
        }

        /* Drop the underline once the rectangle appears on hover. */
        .topics a:hover {
            text-decoration: none;
            border-color: #555;
            background-color: #ffd84d;
        }

        /* Author list sits under the title, aligned with the page content. */
        .authors {
            margin-top: -0.15rem;
            font-size: 0.78rem;
            color: #444;
        }

        .authors .me {
            font-weight: 600;
            color: #1a1a1a;
        }
    </style>

    <style id="sticky-footer-style">
        /* Keep the copyright footer pinned to the bottom of short pages. */
        body { min-height: calc(100vh - 4rem); }
    </style>
</head>

<body>
    <div class="nav">
        <a href="../" class="nav-home">Home</a>
        <a href="../neuroscience/" class="nav-neuroscience">Neuroscience</a>
        <a href="../projects/" class="nav-projects">Projects</a>
        <a href="../publications/" class="nav-publications active">Publications</a>
        <a href="../drawings/" class="nav-drawings">Drawings</a>
    </div>

    <ul class="topics">
        <li>
            <a href="https://umass-embodied-agi.github.io/SyncWorld/" target="_blank" rel="noopener">SyncWorld (NeurIPS 2026, Oral)</a>
            <div class="authors">Yuncong Yang*, Zhengtao Han*, <span class="me">Furkan Ozyurt*</span>, Zeyuan Yang, Han Yang, Junyi Cao, Haoyu Zhen, Yilun Du, Chuang Gan</div>
        </li>
    </ul>

    <script src="../js/rectangles-toggle.js"></script>
    <script src="../js/movie-lamp.js"></script>
</body>

</html>
